name: scholar_wallet
description: Scholar Wallet - allowance distribution & receipt tracking for scholars.
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.5   # push notifications (FCM)
  cloud_firestore: ^5.5.0
  supabase_flutter: ^2.8.0

  # Biometrics: real fingerprint enrollment + verification
  local_auth: ^2.3.0

  # QR: admin issues a QR per payout, scholar scans to confirm receipt
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utils
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  google_fonts: ^6.3.3
  uuid: ^4.5.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
